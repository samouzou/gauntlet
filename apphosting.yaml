# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
  # Omni video generation/edits can take longer than the default.
  timeoutSeconds: 300
  # Video base64/URI handling needs more than the 512MiB default.
  memoryMiB: 2048
  # Extending scenes re-encodes up to 40s of video with ffmpeg.
  cpu: 2

# Bind secrets created with:
#   firebase apphosting:secrets:set GEMINI_API_KEY
# Without this binding, server actions will not see GEMINI_API_KEY at runtime.
env:
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
  # AppSumo code signing key: firebase apphosting:secrets:set APPSUMO_CODE_SECRET
  - variable: APPSUMO_CODE_SECRET
    secret: APPSUMO_CODE_SECRET
  # Verza's Stripe account (shared with Prism so credit packs reuse its prices):
  #   firebase apphosting:secrets:set STRIPE_SECRET_KEY
  #   firebase apphosting:secrets:set STRIPE_WEBHOOK_SECRET
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
